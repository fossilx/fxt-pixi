[workspace]
authors = ["Tony <fossilx@gmail.com>"]
channels = ["conda-forge"]
name = ".jupyter-pixi-v2"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
#re: core
python = ">=3.14.7,<3.15"
polars = ">=1.44.2,<2"
pandas = ">=3.0.6,<4"
pyarrow = ">=25.0.0,<26"
duckdb = ">=1.5.5,<2"
tzdata = ">=2026c,<2027a"
python-dateutil = ">=2.9.0.post0,<3"
pydantic = ">=2.13.5,<3"
loguru = ">=0.7.3,<0.8"

#re: jupyterlab
jupyterlab = ">=4.6.4,<5"
nbformat = ">=5.11.1,<6"
ipykernel = ">=7.3.0,<8"
ipywidgets = ">=8.1.9,<9"

#re: plotting
altair = ">=6.2.2,<7"
plotly = ">=7.1.0,<8"
bokeh = ">=3.10.0,<4"
pygal = ">=3.1.3,<4"
jupyter_bokeh = ">=4.1.0,<5"

#re: data
yfinance = ">=1.7.0,<2"
pandas_market_calendars = ">=5.4.0,<6"

#re: terminal
tqdm = ">=4.70.1,<5"
textual = ">=8.2.8,<9"
rich = ">=15.0.0,<16"
inquirerpy = ">=0.3.4,<0.4"



[pypi-dependencies]
#re: jupyterlab
jupyterlab-execute-time = ">=3.3.0, <4"
#re: data
dukascopy-python = ">=4.0.1, <5"
getch = ">=1.0, <2"
#re: terminal


