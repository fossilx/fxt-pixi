[workspace]
authors = ["Tony <fossilx@gmail.com>"]
channels = ["conda-forge"]
name = "jupyter-pixi"
platforms = ["linux-64"]
version = "0.1.0"

#! dev tooling
[feature.dev.dependencies]
ruff = "*"
pytest = "*"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
#jupyter script works by itself, but seems to have issues when run through pixi
#so call directly for now -- ill figure it out later
#the below correctly launches it, but it had issues for some reason
#jupyter = { cmd = "./../scripts/jupyter.sh", cwd = "jupyter" }
# --notebook-dir=path/to/notebook/dir  (if needed)
# --config=path/to/config/file  (if needed)
#jupyter = { cmd = "jupyter lab --no-browser --custom-css", cwd = "jupyter" }
#jupyter = { cmd = "./scripts/jupyter-local.sh" }
lint = "ruff check ."
test = "pytest packages"
#tools = "python scripts/tools.py"
#con = "python apps/02-consolidation/consolidate.py"
#lab = "jupyter lab --no-browser --custom-css --config=jupyter/jupyter-conf.py"
lab = "python jupyter/.jupyter/launcher.py"
#apps:
dl = "python -m fxtapps.downloader.cli"



[activation]
#time zone support
#env = { PYTHONTZPATH = "$PIXI_PROJECT_ROOT/.pixi/envs/default/share/zoneinfo" }
env = { PYTHONTZPATH = "$CONDA_PREFIX/share/zoneinfo" }


[pypi-dependencies]
jupyterlab-execute-time = ">=3.3.0, <4"
jupyterlab-myst = ">=2.7.0, <3"
dukascopy-python = ">=4.0.1, <5"
getch = ">=1.0, <2"
#re: custom libs
fxt = { path = "./packages/fxt", editable = true }
#apps = { path = "./apps", editable = true }
fxtapps = { path = "./packages/fxtapps", editable = true }

[dependencies]
#re: core
python = ">=3.14.7,<3.15"
polars = ">=1.44.2,<2"
pandas = ">=3.0.6,<4"
pyarrow = ">=25.0.0,<26"
duckdb = ">=1.5.5,<2"
tzdata = ">=2026c,<2027a"
python-dateutil = ">=2.9.0.post0,<3"
pydantic = ">=2.13.5,<3"
loguru = ">=0.7.3,<0.8"
#re: jupyter
jupyterlab = ">=4.6.4,<5"
pixi-kernel = ">=0.7.1,<0.8"
nbformat = ">=5.11.1,<6"
ipykernel = ">=7.3.0,<8"
ipywidgets = ">=8.1.9,<9"
#re: plotting
altair = ">=6.2.2,<7"
plotly = ">=7.1.0,<8"
bokeh = ">=3.10.0,<4"
pygal = ">=3.1.3,<4"
jupyter_bokeh = ">=4.1.0,<5"
#re: data
yfinance = ">=1.7.0,<2"
pandas_market_calendars = ">=5.4.0,<6"
#re: terminal
tqdm = ">=4.70.1,<5"
textual = ">=8.2.8,<9"
rich = ">=15.0.0,<16"
inquirerpy = ">=0.3.4,<0.4"
#misc
rapidfuzz = ">=3.14.6,<4"
pydantic-settings = ">=2.15.0,<3"
click = ">=8.5.0,<9"
questionary = ">=2.1.1,<3"
phx-class-registry = ">=5.2.2,<6"
alive-progress = ">=3.3.0,<4"
sqlite-utils = ">=4.2.1,<5"
blake3 = ">=1.0.11,<2"




