python-dateutil = ">=2.9.0.post0,<3"
pydantic = ">=2.13.5,<3"
loguru = ">=0.7.3,<0.8"

#jupyterlab
jupyterlab = ">=4.6.4,<5"
nbformat = ">=5.11.1,<6"
ipykernel = ">=7.3.0,<8"
ipywidgets = ">=8.1.9,<9"
altair = ">=6.2.2,<7"
plotly = ">=7.1.0,<8"
bokeh = ">=3.10.0,<4"
pygal = ">=3.1.3,<4"
jupyter_bokeh = ">=4.1.0,<5"

[pypi-dependencies]
jupyterlab-execute-time = ">=3.3.0, <4"

